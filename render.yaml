services:
  - type: web
    name: adaptiveauth
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: deploy
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: adaptiveauth-db
          property: connectionString

databases:
  - name: adaptiveauth-db
    databaseName: adaptiveauth
    plan: free
